<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickerAgent</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b2430; --muted: #5b6675; --line: #e3e7ec;
    --accent: #1f4e79; --up: #1a7f4b; --down: #b3261e; --warn-bg: #fff4d6; --warn: #7a5600;
    --chip: #e8eef6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--accent); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .tag { opacity: .8; font-size: 13px; }
  header form { display: flex; gap: 8px; margin-left: auto; position: relative; }
  header input { font: inherit; padding: 8px 12px; border-radius: 6px; border: 0; width: 260px; max-width: 60vw; }
  .sugg { position: absolute; top: 42px; left: 0; width: 360px; max-width: 92vw; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 10; padding: 4px 0; display: none; }
  .sugg.open { display: block; }
  .sugg div { padding: 7px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .sugg div.on, .sugg div:hover { background: var(--chip); }
  .sugg b { min-width: 58px; } .sugg span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .sugg small { color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 16px; margin-top: 12px; font-size: 13px; }
  .facts div span { display: block; color: var(--muted); font-size: 12px; }
  header button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; background: #f2c14e; color: #1b2430; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button { font: inherit; cursor: pointer; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .top { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
  .brief { container-type: inline-size; min-width: 0; }
  @container (max-width: 760px) { .top, .grid2 { grid-template-columns: 1fr !important; } }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .chat { position: static !important; max-height: none !important; } .chat .msgs { max-height: 70vh; } }
  @media (max-width: 820px) { .top, .grid2 { grid-template-columns: 1fr !important; } header { padding: 12px 16px; } header form { margin-left: 0; width: 100%; } header input { flex: 1; width: auto; max-width: none; } }
  .chat { position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; padding: 0; }
  .chat .head { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  .chat .head h2 { margin: 0; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 160px; }
  .bubble { font-size: 14px; line-height: 1.55; }
  .bubble.user { align-self: flex-end; background: var(--chip); color: var(--ink); padding: 8px 12px; border-radius: 12px 12px 2px 12px; max-width: 88%; }
  .bubble.ai p { margin: 0 0 8px; }
  .bubble.ai .live { white-space: pre-wrap; }
  .bubble .note { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .qchip { background: var(--card); border: 1px solid var(--line); color: var(--accent); border-radius: 14px; padding: 5px 11px; font-size: 13px; text-align: left; }
  .qchip:hover { border-color: var(--accent); }
  button.cite { border: 0; cursor: pointer; }
  .unv { text-decoration: underline dotted var(--warn); text-underline-offset: 3px; }
  .quote { margin-top: 8px; border-left: 3px solid var(--accent); background: var(--bg); padding: 8px 10px; font-size: 13px; border-radius: 0 6px 6px 0; }
  .quote blockquote { margin: 4px 0 6px; white-space: pre-wrap; }
  .quote a { color: var(--accent); }
  .ask { display: flex; gap: 8px; padding: 10px 18px 6px; border-top: 1px solid var(--line); }
  .ask textarea { flex: 1; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; resize: none; min-height: 40px; max-height: 120px; }
  .ask button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 14px; font-weight: 600; }
  .chat .disclaimer { padding: 0 18px 12px; margin: 0; }
  details.loaded { font-size: 12px; color: var(--muted); margin-top: 6px; } details.loaded summary { cursor: pointer; }
  .name { font-size: 22px; font-weight: 650; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .price { font-size: 32px; font-weight: 650; margin-top: 6px; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .range { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .bar { position: relative; height: 6px; background: var(--line); border-radius: 3px; margin: 4px 0; }
  .bar i { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--accent); }
  .oneliner { margin-top: 12px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 0 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ul { margin: 0; padding-left: 18px; } li { margin-bottom: 8px; }
  .cite { display: inline-block; background: var(--chip); color: var(--accent); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 600; margin-left: 4px; text-decoration: none; }
  .flag { display: inline-block; background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  .qa { margin-bottom: 12px; } .qa b { display: block; }
  .sources li { font-size: 13px; } .sources a { color: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .badge { padding: 1px 8px; border-radius: 10px; font-weight: 600; }
  .badge.ai { background: #dff3e7; color: var(--up); } .badge.extractive { background: var(--warn-bg); color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .disclaimer { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .err { background: #fde8e7; color: var(--down); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 1s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div><h1>TickerAgent</h1><div class="tag">Get up to speed on a stock before the client call, with every point sourced.</div></div>
  <form id="f" role="search"><input id="t" placeholder="Ticker or company, e.g. NVDA or berkshire" autocomplete="off" aria-label="Ticker or company name" aria-autocomplete="list" aria-controls="sugg" required><div id="sugg" class="sugg" role="listbox"></div><button id="go">Build brief</button></form>
</header>
<main id="out"><div class="empty">Type a ticker or company name to build a brief from Nasdaq market data and the company's latest SEC filings.</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let SRC = {};
const money = (v, ps) => {
  if (v == null) return "—";
  if (ps) return "$" + v.toFixed(2);
  const a = Math.abs(v), s = v < 0 ? "-" : "";
  return a >= 1e9 ? `${s}$${(a/1e9).toFixed(1)}B` : a >= 1e6 ? `${s}$${(a/1e6).toFixed(1)}M` : `${s}$${a.toLocaleString()}`;
};
const cites = ids => ids.map(id => SRC[id] ? `<a class="cite" href="${esc(SRC[id].url)}" target="_blank" title="${esc(SRC[id].label + ' — ' + SRC[id].section)}">${esc(id)}</a>` : "").join("");
const flags = nums => nums && nums.length ? `<span class="flag" title="Figure not found in the cited excerpt; check before quoting">check: ${nums.map(esc).join(", ")}</span>` : "";
const list = items => items.length ? `<ul>${items.map(p => `<li>${esc(p.point)}${cites(p.sources)}${flags(p.unverified_numbers)}</li>`).join("")}</ul>` : `<div class="sub">Not covered in the latest filings.</div>`;

function chart(hist) {
  if (!hist || hist.length < 2) return "";
  const c = hist.map(r => r.close), w = 300, h = 70, lo = Math.min(...c), hi = Math.max(...c);
  const pts = c.map((v, i) => `${((i/(c.length-1))*w).toFixed(1)},${(h - ((v-lo)/(hi-lo||1))*h).toFixed(1)}`).join(" ");
  const col = c.at(-1) >= c[0] ? "var(--up)" : "var(--down)";
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="margin-top:10px;max-width:420px" role="img" aria-label="One-year daily closing prices"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <div class="sub">Daily close ${esc(hist[0].date)} to ${esc(hist.at(-1).date)} · low $${lo.toFixed(2)} · high $${hi.toFixed(2)}</div>`;
}

const bigMoney = v => v == null ? "—" : v >= 1e12 ? `$${(v/1e12).toFixed(2)}T` : v >= 1e9 ? `$${(v/1e9).toFixed(1)}B` : `$${(v/1e6).toFixed(0)}M`;

function marketHtml(m) {
  const q = m.quote, sm = m.summary, errs = m.errors || {};
  let html = "";
  if (q) {
    const up = (q.change ?? 0) >= 0, sign = up ? "+" : "";
    html += `<div class="price">$${q.price.toFixed(2)} <span class="chg ${up ? "up" : "down"}" style="font-size:16px">${q.change == null ? "" : sign + q.change.toFixed(2)} ${q.change_pct == null ? "" : "(" + sign + q.change_pct.toFixed(2) + "%)"}</span></div>
      <div class="sub">${esc(q.exchange || "")} · last trade ${esc(q.trade_time || "time not given")}${q.is_real_time ? " (real time)" : ""}${q.market_status ? " · market " + esc(q.market_status.toLowerCase()) : ""}${m.one_year_pct != null ? ` · 1-yr ${m.one_year_pct > 0 ? "+" : ""}${m.one_year_pct}%` : ""}</div>`;
  } else html += `<div class="sub">Quote unavailable right now. ${esc(errs.quote || errs.all || "")}</div>`;
  if (sm) {
    const pos = (q && sm.high_52w && sm.low_52w != null) ? Math.max(0, Math.min(100, ((q.price - sm.low_52w) / (sm.high_52w - sm.low_52w || 1)) * 100)) : null;
    if (sm.high_52w) html += `<div class="range">52-week range${pos != null ? `<div class="bar"><i style="left:${pos}%"></i></div>` : " "}$${sm.low_52w} — $${sm.high_52w}</div>`;
    const f = [["Previous close", sm.previous_close != null ? "$" + sm.previous_close.toFixed(2) : null], ["Market cap", sm.market_cap ? bigMoney(sm.market_cap) : null],
               ["Dividend (annual)", sm.dividend], ["Yield", sm.yield], ["Sector", sm.sector], ["Industry", sm.industry]].filter(x => x[1]);
    html += `<div class="facts">${f.map(([k, v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div>`;
  } else if (q) html += `<div class="sub" style="margin-top:8px">Range, market cap and dividend unavailable right now.</div>`;
  html += m.history ? chart(m.history) : `<div class="sub" style="margin-top:8px">Price history unavailable right now.</div>`;
  return html + `<div class="sub" style="margin-top:6px">Market data: ${esc(m.source || "Nasdaq")}. Prices from data, not the model.</div>`;
}

function render(d) {
  SRC = Object.fromEntries(d.sources.map(s => [s.id, s]));
  const s = d.summary, m = d.meta;
  const quoteHtml = marketHtml(d.market);
  const figs = d.figures.length ? `<table><tr><th>Reported (fiscal year)</th><th>Latest</th><th>Prior</th><th>Change</th></tr>${d.figures.map(f => {
      const ch = f.prior ? ((f.value - f.prior) / Math.abs(f.prior) * 100) : null;
      return `<tr><td>${esc(f.metric)}</td><td>${money(f.value, f.is_per_share)}</td><td>${money(f.prior, f.is_per_share)}</td><td class="chg ${ch >= 0 ? "up" : "down"}">${ch == null ? "—" : (ch >= 0 ? "+" : "") + ch.toFixed(1) + "%"}</td></tr>`;
    }).join("")}</table><div class="sub" style="margin-top:6px">From the company's structured 10-K data (XBRL), fiscal year ended ${esc(d.figures[0].period_end)}. Not model-generated.</div>`
    : `<div class="sub">Structured figures not available for this filer.</div>`;

  $("#out").innerHTML = `<div class="layout"><div class="brief">
  <div class="top">
    <div class="card"><p class="name">${esc(d.company.name)} <span class="sub">${esc(d.company.symbol)}</span></p>${quoteHtml}
      <div class="oneliner">${esc(s.one_liner)}</div></div>
    <div class="card"><h2>Key figures</h2>${figs}</div>
  </div>
  <div class="grid2">
    <div class="card"><h2>What the company does</h2>${list(s.snapshot)}</div>
    <div class="card"><h2>What's new (latest filings)</h2>${list(s.recent_developments)}</div>
    <div class="card"><h2>What's driving results</h2>${list(s.performance_drivers)}</div>
    <div class="card"><h2>Key risks</h2>${list(s.key_risks)}</div>
  </div>
  <div class="card"><h2>Questions your client may ask</h2>${s.client_questions.length ? s.client_questions.map(x => `<div class="qa"><b>${esc(x.question)}</b>${esc(x.answer)}${cites(x.sources)}${flags(x.unverified_numbers)}</div>`).join("") : `<div class="sub">Available when the AI summary is on.</div>`}</div>
  <div class="card"><h2>Ask a follow-up</h2>${suggestHtml(d.suggested_questions)}</div>
  <div class="card sources"><h2>Sources</h2><ul>${d.sources.map(x => `<li><b>${esc(x.id)}</b> ${esc(x.label)} — ${esc(x.section)} · <a href="${esc(x.url)}" target="_blank">open filing on SEC.gov</a></li>`).join("")}</ul></div>
  <div class="meta">
    <span class="badge ${m.mode}">${m.mode === "ai" ? "AI summary" : "Extractive preview"}</span>
    <span>${esc(m.note)}</span>
    ${(m.notes || []).map(n => `<span>${esc(n)}</span>`).join("")}
    ${m.grounding && m.grounding.points != null ? `<span>Grounding: ${m.grounding.points} cited points · ${m.grounding.dropped_uncited} uncited dropped · ${m.grounding.flagged_numbers} flagged for figure check</span>` : ""}
    <span>Data ${m.data_seconds}s · total ${m.total_seconds}s · ${esc(m.generated)}</span>
  </div>
  <div class="disclaimer">For advisor preparation only. Summarizes public company disclosures; not investment advice or a recommendation. Verify figures against the linked filings before sharing with clients.</div>
  </div>${chatPanel(d)}</div>`;
  startChat(d);
}

// ---- Chat --------------------------------------------------------------------
let CHAT = { ticker: null, history: [], busy: false };
let CITES = {}, NCITE = 0;
const suggestHtml = qs => (qs && qs.length) ? `<div class="chips">${qs.map(q => `<button type="button" class="qchip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : "";

function chatPanel(d) {
  return `<aside class="card chat" id="chat" aria-label="Chat about ${esc(d.company.symbol)}">
    <div class="head"><h2>Ask about ${esc(d.company.symbol)}</h2><div class="sub">Answers use only the filings and market data loaded above, with the quoted source one tap away.</div></div>
    <div class="msgs" id="msgs" aria-live="polite"><div class="bubble ai"><span class="note">Try one of these, or type your own question.</span></div>${suggestHtml(d.suggested_questions)}</div>
    <form class="ask" id="askf"><textarea id="q" rows="1" maxlength="1000" placeholder="Ask a question about ${esc(d.company.symbol)}" aria-label="Your question"></textarea><button id="send">Ask</button></form>
    <div class="disclaimer">For advisor preparation only. Not investment advice or a recommendation.</div>
  </aside>`;
}

function startChat(d) {
  CHAT = { ticker: d.company.symbol, history: [], busy: false };
  CITES = {}; NCITE = 0;
  $("#askf").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) ask(q); });
  $("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#askf").requestSubmit(); } });
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".qchip");
  if (chip) { ask(chip.dataset.q); return; }
  const c = e.target.closest("button.cite[data-k]");
  if (c) {
    const box = c.closest(".bubble").querySelector(".quotebox"), x = CITES[c.dataset.k];
    if (box.dataset.k === c.dataset.k) { box.innerHTML = ""; box.dataset.k = ""; return; }
    box.dataset.k = c.dataset.k;
    box.innerHTML = `<div class="quote"><b>${esc(x.title)}</b><blockquote>${esc(x.cited_text)}</blockquote>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.source.startsWith("S") || x.source === "F" ? "Open the filing on SEC.gov" : "Open the quote on Nasdaq"}</a>` : ""}</div>`;
  }
});

function para(html) { return "<p>" + html.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>") + "</p>"; }

function finalHtml(f) {
  if (f.unavailable || f.refused) return `<p class="note">${esc(f.message)}</p>`;
  let html = "";
  for (const b of f.blocks) {
    const unv = b.flags.find(x => x.type === "unverified"), chk = b.flags.find(x => x.type === "check");
    html += unv ? `<span class="unv" title="Unverified: states a number or date without a source">${esc(b.text)}</span>` : esc(b.text);
    const seen = new Set();
    for (const c of b.citations) {
      if (seen.has(c.source + c.cited_text)) continue;
      seen.add(c.source + c.cited_text);
      const k = "c" + (++NCITE); CITES[k] = c;
      html += `<button type="button" class="cite" data-k="${k}" title="Show the quoted passage">${esc(c.source)}</button>`;
    }
    if (chk) html += `<span class="flag" title="Not found in the cited passage or the market and figures data; check before quoting">check: ${chk.numbers.map(esc).join(", ")}</span>`;
    if (unv) html += `<span class="flag" title="States a number or date without a citation">unverified</span>`;
  }
  const loaded = (f.sources || []).map(s => esc(s.title)).join("<br>");
  return para(html || esc("No answer was returned.")) + `<div class="quotebox"></div>
    <details class="loaded"><summary>Loaded data (${(f.sources || []).length} sources)</summary>${loaded}</details>`;
}

async function ask(question) {
  if (CHAT.busy || !CHAT.ticker) return;
  CHAT.busy = true; $("#send").disabled = true; $("#q").value = "";
  const msgs = $("#msgs");
  msgs.insertAdjacentHTML("beforeend", `<div class="bubble user">${esc(question)}</div><div class="bubble ai"><div class="live"><span class="spinner"></span></div></div>`);
  const bubble = msgs.lastElementChild, live = bubble.querySelector(".live");
  if (window.matchMedia("(max-width: 1100px)").matches) $("#chat").scrollIntoView({ behavior: "smooth", block: "start" });
  msgs.scrollTop = msgs.scrollHeight;
  let text = "", done = false;
  const fail = m => { bubble.innerHTML = `<p class="note">${esc(m)}</p>`; };
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticker: CHAT.ticker, question, history: CHAT.history.slice(-12) }) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); fail(d.detail || "Something went wrong. Please try again."); return; }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (!done) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (chunk.match(/^event: (.*)$/m) || [])[1], raw = (chunk.match(/^data: (.*)$/m) || [])[1];
        const data = raw ? JSON.parse(raw) : {};
        if (ev === "delta") { text += data.text; live.textContent = text; msgs.scrollTop = msgs.scrollHeight; }
        else if (ev === "reset") { text = ""; live.textContent = ""; }
        else if (ev === "error") { fail(data.message); done = true; }
        else if (ev === "final") {
          bubble.innerHTML = finalHtml(data); done = true;
          if (!data.unavailable && !data.refused) {
            const answer = data.blocks.map(b => b.text).join("").slice(0, 6000);
            if (answer) CHAT.history.push({ role: "user", content: question }, { role: "assistant", content: answer });
          }
        }
      }
    }
    if (!done) fail("The answer was interrupted. Please try again.");
  } catch (err) {
    fail("Could not reach the server. Please try again.");
  } finally {
    CHAT.busy = false; $("#send").disabled = false; msgs.scrollTop = msgs.scrollHeight;
  }
}

async function loadBrief(t) {
  $("#go").disabled = true;
  closeSugg();
  $("#out").innerHTML = `<div class="empty"><span class="spinner"></span>Pulling Nasdaq market data and ${esc(t)}'s latest 10-K, 10-Q and 8-Ks from SEC EDGAR, then summarizing…</div>`;
  try {
    const r = await fetch(`/api/brief/${t.split("/").map(encodeURIComponent).join("/")}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || "Something went wrong building the brief. Please try again.");
    render(d);
  } catch (err) {
    $("#out").innerHTML = `<div class="card err">${esc(err.message)}</div>`;
  } finally { $("#go").disabled = false; }
}

// Search suggestions as the advisor types.
let MATCHES = [], ACTIVE = -1, TIMER = null, SEQ = 0;
function closeSugg() { $("#sugg").classList.remove("open"); MATCHES = []; ACTIVE = -1; $("#t").setAttribute("aria-expanded", "false"); }
function drawSugg() {
  const box = $("#sugg");
  if (!MATCHES.length) { closeSugg(); return; }
  box.innerHTML = MATCHES.map((m, i) => `<div role="option" data-i="${i}" class="${i === ACTIVE ? "on" : ""}" aria-selected="${i === ACTIVE}"><b>${esc(m.symbol)}</b><span>${esc(m.name)}</span><small>${esc(m.last || "")}</small></div>`).join("");
  box.classList.add("open"); $("#t").setAttribute("aria-expanded", "true");
}
$("#t").addEventListener("input", () => {
  clearTimeout(TIMER);
  const q = $("#t").value.trim();
  if (!q) { closeSugg(); return; }
  TIMER = setTimeout(async () => {
    const seq = ++SEQ;
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const d = await r.json();
      if (seq !== SEQ) return;
      MATCHES = d.matches || []; ACTIVE = MATCHES.length ? 0 : -1; drawSugg();
    } catch { closeSugg(); }
  }, 150);
});
$("#t").addEventListener("keydown", e => {
  if (!MATCHES.length) return;
  if (e.key === "ArrowDown") { ACTIVE = (ACTIVE + 1) % MATCHES.length; drawSugg(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { ACTIVE = (ACTIVE - 1 + MATCHES.length) % MATCHES.length; drawSugg(); e.preventDefault(); }
  else if (e.key === "Escape") closeSugg();
});
$("#sugg").addEventListener("mousedown", e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  e.preventDefault();
  const m = MATCHES[+el.dataset.i]; $("#t").value = m.symbol; loadBrief(m.symbol);
});
$("#t").addEventListener("blur", () => setTimeout(closeSugg, 100));
$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const pick = ACTIVE >= 0 ? MATCHES[ACTIVE] : null;
  const t = pick ? pick.symbol : $("#t").value.trim().toUpperCase();
  if (pick) $("#t").value = pick.symbol;
  if (t) loadBrief(t);
});
// A link such as /?t=NVDA opens that brief directly.
const START = new URLSearchParams(location.search).get("t");
if (START) { $("#t").value = START.toUpperCase(); loadBrief(START.toUpperCase()); }
</script>
</body>
</html>
